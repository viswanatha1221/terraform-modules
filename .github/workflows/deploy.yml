name: Terraform CI CD Pipeline for Deploying AWS Resources
run-name: ${{ github.actor }} has triggered the pipeline

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
      terraform_action:
        description: 'Terraform_Action'
        default: ''
        type: choice
        options:
           - ''
           - plan
           - apply        
      TF_LOG:
        description: 'Terraform log level'
        required: true
        default: 'DEBUG'
        type: choice
        options:
          - TRACE
          - DEBUG
          - INFO
          - ERROR

env:
  TF_LOG: ${{ github.event.inputs.tf_log_level }}
  working-directory: "env/${{ github.event.inputs.environment }}"
  
jobs:
  build-infra:
    name: terraform-ci-cd
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
    - name: Set AWS credentials
      env:
        AWS_ACCESS_KEY_ID: ${{ github.event.inputs.environment == 'dev' && secrets.AWS_ACCESS_KEY_DEV || secrets.AWS_ACCESS_KEY_STAGE }}
        AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.environment == 'dev' && secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY_STAGE }}
      run: |
        echo "AWS credentials set for ${{ github.event.inputs.environment }}"
    - name: Terraform Fmt
      id: fmt
      run: terraform fmt -check
      continue-on-error: true
    - name: Terraform Init
      id: init
      env:
        AWS_ACCESS_KEY_ID: ${{ github.event.inputs.environment == 'dev' && secrets.AWS_ACCESS_KEY_DEV || secrets.AWS_ACCESS_KEY_STAGE }}
        AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.environment == 'dev' && secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY_STAGE }}
      run: terraform init
      working-directory: ${{ env.working-directory }}
    - name: List files
      run: ls -R
    - name: Terraform Validate
      id: validate
      run: terraform validate
      working-directory: ${{ env.working-directory }}
    - name: Terraform Plan 
      id: plan
      run: terraform plan -out=tfplan -no-color -var-file="../env/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars" $TF_LOG
      working-directory: ${{ env.working-directory }}
    - name: Plan output
      id: output
      uses: actions/github-script@v3
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            ### Workspace
 
            \`${process.env.TF_WORKSPACE}\`
 
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
 
            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
 
            </details>
 
            **Pusher**: @${{ github.actor }}
            **Action**: ${{ github.event_name }}
            `;
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
    - name: Terraform Apply
      id: apply
      #if: github.ref == 'refs/heads/main' && github.event.inputs.terraform_action == 'apply'
      run: terraform apply -auto-approve -input=false -no-color tfplan
      working-directory: ${{ env.working-directory }}